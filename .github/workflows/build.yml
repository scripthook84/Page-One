name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file patchelf libwebkit2gtk-4.1-dev \
            libgtk-3-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: cargo test -p pageone-core
      - run: npx tauri build --bundles deb
      - name: Rename package
        run: |
          cd target/release/bundle/deb
          for f in *.deb; do mv "$f" "${f// /-}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: page-one-deb
          path: target/release/bundle/deb/*.deb

  # Universal .dmg (Apple Silicon and Intel). Without Apple signing secrets the app is
  # ad-hoc signed: it runs, but macOS asks the user to approve it the first time.
  # With the secrets below set in the repository, it is signed with your Developer ID
  # and notarized, and opens without a warning.
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: cargo test -p pageone-core
      - name: Signing (Developer ID if configured, ad-hoc otherwise)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Signing with Developer ID"
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarizing with Apple"
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            fi
          else
            echo "No Developer ID configured: ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - run: npx tauri build --bundles dmg --target universal-apple-darwin
      - name: Name the disk image
        run: |
          cd target/universal-apple-darwin/release/bundle/dmg
          for f in *.dmg; do mv "$f" "Page-One_1.0.0_universal.dmg"; done
          ls -la
      - name: Check the app bundle
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/Page One.app"
          lipo -info "$APP/Contents/MacOS/page-one"
          codesign --verify --deep --verbose=2 "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleShortVersionString|LSMinimumSystemVersion|pageone"
      - uses: actions/upload-artifact@v4
        with:
          name: page-one-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Publish both installers on the v1.0.0 release page (marked pre-release until tested on every
  # platform). Each new build replaces the files there.
  release:
    needs: [linux-deb, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Page One 1.0.0
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: |
            dist/*.deb
            dist/*.dmg
