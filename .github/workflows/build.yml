name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # README and docs edits skip the build; RELEASE_NOTES.md is the release description, so it rebuilds
    paths: ["**", "!README.md", "!docs/**"]
  workflow_dispatch:

# a newer push replaces a build still running
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file patchelf libwebkit2gtk-4.1-dev \
            libgtk-3-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voice components (cached download)
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: voice-linux-kokoro1.0-fp16-ort1.20.1-misaki0.7.4-cmudict1.1.3
      - name: Built-in voices
        run: bash scripts/fetch_voice_assets.sh linux
      - run: npm ci || npm install
      - run: cargo test -p pageone-core
      - run: npx tauri build --bundles deb
      - name: Rename package
        run: |
          cd target/release/bundle/deb
          for f in *.deb; do mv "$f" "${f// /-}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: page-one-deb
          path: target/release/bundle/deb/*.deb

  # Universal .dmg (Apple Silicon and Intel). Without Apple signing secrets the app is
  # ad-hoc signed: it runs, but macOS asks the user to approve it the first time.
  # With the secrets below set in the repository, it is signed with your Developer ID
  # and notarized, and opens without a warning.
  macos-dmg:
    # paused: this build ships the Linux .deb only (set to true to build it again)
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voice components (cached download)
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: voice-macos-kokoro1.0-fp16-ort1.20.1-misaki0.7.4-cmudict1.1.3
      - name: Built-in voices
        run: bash scripts/fetch_voice_assets.sh macos
      - run: npm ci || npm install
      - run: cargo test -p pageone-core
      - name: Signing (Developer ID if configured, ad-hoc otherwise)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Signing with Developer ID"
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarizing with Apple"
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            fi
          else
            echo "No Developer ID configured: ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - run: npx tauri build --bundles dmg --target universal-apple-darwin
      - name: Name the disk image
        run: |
          cd target/universal-apple-darwin/release/bundle/dmg
          for f in *.dmg; do mv "$f" "Page-One_1.1.0_universal.dmg"; done
          ls -la
      - name: Check the app bundle
        continue-on-error: true
        run: |
          set +e
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | cut -c1-900)"; }
          DMG=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>&1 | head -1)
          note "dmg" "$DMG"
          MNT=$(mktemp -d)
          # the disk image shows the licence agreement first; accept it for the check
          note "mount" "$(yes | PAGER=cat hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" 2>&1 | tail -1)"
          note "contents" "$(ls "$MNT" 2>&1)"
          APP="$MNT/Page One.app"
          note "architectures" "$(lipo -info "$APP/Contents/MacOS/page-one" "$APP/Contents/Frameworks/libonnxruntime.dylib" 2>&1)"
          note "signature" "$(codesign --verify --deep --strict --verbose=2 "$APP" 2>&1; echo "exit $?")"
          note "entitlements" "$(codesign -d --entitlements - "$APP" 2>&1 | grep -o 'disable-library-validation' | head -1)"
          note "voices" "$(ls "$APP/Contents/Resources/voice" 2>&1)"
          hdiutil detach "$MNT" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: page-one-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Windows .msi (64-bit). Unsigned: Windows SmartScreen asks once ("More info" → "Run anyway").
  # WebView2 ships with Windows 10 and 11; the installer fetches it if a PC lacks it.
  windows-msi:
    # paused: this build ships the Linux .deb only (set to true to build it again)
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voice components (cached download)
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: voice-windows-kokoro1.0-fp16-ort1.20.1-misaki0.7.4-cmudict1.1.3
      - name: Built-in voices
        shell: bash
        run: bash scripts/fetch_voice_assets.sh windows
      - run: npm ci
      - run: cargo test -p pageone-core
      - run: npx tauri build --bundles msi
      - name: Name the installer
        shell: bash
        run: |
          cd target/release/bundle/msi
          for f in *.msi; do mv "$f" "Page-One_1.1.0_x64.msi"; done
          ls -la
          echo "::notice title=msi::$(ls -la | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: page-one-msi
          path: target/release/bundle/msi/*.msi

  # Publish the installers on the v1.1.0 release page (marked pre-release until tested on every
  # platform). Each new build replaces the files there.
  release:
    needs: [linux-deb]
    if: ${{ !cancelled() && needs.linux-deb.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: ${{ github.sha }}
          name: Page One 1.1.0
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: |
            dist/*.deb
